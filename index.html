SW.forEach(w=>{const e=document.createElement('span');e.className='w';e.textContent=w;spW.appendChild(e);wEl[w]=e});

for(let r=0;r<15;r++)for(let c=0;c<15;c++){const b=document.createElement('button');b.className='cell';b.textContent=SG[r][c];b.dataset.r=r;b.dataset.c=c;
 const start=()=>{drag=true;sel=[b];b.classList.add('s')},over=()=>{if(drag&&!sel.includes(b)){sel.push(b);b.classList.add('s');beep(700,.03,'sine',.02)}};
 b.onmousedown=start;b.onmouseenter=over;b.addEventListener('touchstart',e=>{e.preventDefault();start()},{passive:false});spG.appendChild(b);cells.push(b)}

function spCheck(){

 const s=sel.map(x=>SG[+x.dataset.r][+x.dataset.c]).join(''),rv=[...s].reverse().join(''),hit=SW.find(w=>!found.has(w)&&(w===s||w===rv));
 if(hit){found.add(hit);sel.forEach(x=>{x.classList.remove('s');x.classList.add('f')});wEl[hit].classList.add('d');beep(784,.15,'triangle',.06);
  spM.textContent=found.size===SW.length?'🎉 ¡Encontraste todas las palabras!':'✨ ¡Encontraste '+hit+'!';if(found.size===SW.length)win()}

}

 ok:v=>v==='BALEX',p:'BALEX',h:['Convertí cada número en su letra: el 2 es B.','Las letras son B, A, L, E y la que ocupa el lugar 24.']},
{t:'El mensaje invertido',c:'SOIRA — ODNUM — ATREUP',
 q:'Leé cada palabra al revés. Solo una es el apellido del astronauta: ¿cuál?',
 ok:v=>v==='ARIOS',p:'ARIOS',h:['Las otras dos palabras son un lugar y un objeto.','Invertida, la primera palabra empieza con A.']},
{t:'Los 17 segundos',c:'17 → 4\n34 → 8\n51 → 12\n68 → ?',
 q:'Hallá el número que falta y pasalo a letra con A=1 (mismo alfabeto del registro 01).',
 ok:v=>v==='16'||v==='P',p:'P',h:['Fijate cuántas veces entra 17 en cada número.','El resultado es 16. ¿Qué letra ocupa ese lugar?']},
{t:'La última letra',c:'"Mi nombre termina con la primera letra\nde la palabra que más escuché en la estación:\nNEXUS."',
 q:'¿Cuál es esa letra?',
 ok:v=>v==='N',p:'N',h:['Leé la palabra en mayúsculas del mensaje.','Solo te piden su letra inicial.']}
];
let S={solved:{},h:{},v:'intro',i:0},tk=0;
try{const d=JSON.parse(localStorage.getItem('astra07'));if(d){S.solved=d.solved||{};S.h=d.h||{}}}catch(e){}
const save=()=>{try{localStorage.setItem('astra07',JSON.stringify({solved:S.solved,h:S.h}))}catch(e){}};
const count=()=>Object.keys(S.solved).length;
q('#aMute').onclick=toggleMute;
function burst(){if(RM)return;R.classList.remove('burst');void R.offsetWidth;R.classList.add('burst');setTimeout(()=>R.classList.remove('burst'),450)}
function shake(){const p=q('#pn');if(!p)return;p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}
function type(el,txt,sp=22){const my=tk;if(el)el.textContent='';
 return new Promise(r=>{let i=0;(function n(){if(!el||my!==tk)return r();el.textContent=txt.slice(0,++i);if(i<txt.length)setTimeout(n,RM?0:sp);else r()})()})}
let left=17;
setInterval(()=>{left--;if(left<=0){left=17;if(R.offsetParent){burst();beep(80,.5,'sawtooth',.05)}}q('#aBeacon').textContent='próxima señal en '+left+' s'},1000);
function go(v,i=0){tk++;S.v=v;S.i=i;render()}
function render(){
 R.querySelectorAll('#aSeg i').forEach((e,k)=>e.classList.toggle('on',!!S.solved[k]));
 q('#aCnt').textContent=count()+'/4 registros recuperados';
 ({intro,hub,rec:()=>rec(S.i),fin,end})[S.v]();
}
function intro(){
 view.innerHTML=`<div class="panel"><h2>Señal recibida</h2><p id="t1"></p><pre class="clue" id="t2"></pre><p id="t3" class="mu"></p><div id="bx" hidden><button class="pri" id="bgo">Comenzar investigación</button></div></div>`;
 q('#bgo').onclick=()=>{beep(520);go('hub')};
 (async()=>{
  await type(q('#t1'),'Diecisiete años después de la desaparición de la Astra-07, una transmisión se repite cada 17 segundos.');
  await type(q('#t2'),'"...si alguien recibe esto..."\n"...no sigan la señal..."\n"...ya nos encontraron."',32);
  await type(q('#t3'),'Las coordenadas llevan a una estación abandonada. Para abrir el sistema NEXUS tenés que recuperar las cuatro partes de la identidad del astronauta.');
  const b=q('#bx');if(b)b.hidden=false;
 })();
}
function hub(){
 view.innerHTML=`<div class="panel"><h2>Estación abandonada</h2><pre class="clue">ASTRA-07 DETECTADA\nTRIPULANTE A-01: MEMORIA INCOMPLETA\n${4-count()} ARCHIVOS BLOQUEADOS</pre>
 <div class="rg">${REC.map((r,i)=>`<button class="rc ${S.solved[i]?'done':''}" data-i="${i}"><small>Registro 0${i+1}</small><b>${r.t}</b><span>${S.solved[i]?'✓ '+r.p:'Bloqueado'}</span></button>`).join('')}</div></div>`;
 view.querySelectorAll('.rc').forEach(b=>b.onclick=()=>{beep(380,.08);go('rec',+b.dataset.i)});
}
function rec(i){
 const r=REC[i],done=S.solved[i],n=S.h[i]||0;
 view.innerHTML=`<div class="panel" id="pn"><button class="ghost" id="bk">← Volver a los registros</button><h2>Registro 0${i+1}: ${r.t}</h2><pre class="clue">${r.c}</pre><p>${r.q}</p>
 <div class="row"><input id="in" autocomplete="off" spellcheck="false" placeholder="Tu respuesta" aria-label="Tu respuesta" ${done?'disabled':''}><button class="pri" id="ok" ${done?'disabled':''}>Descifrar</button><button id="hn" ${done||n>=2?'disabled':''}>Pista (${n}/2)</button></div>
 <div id="hs">${r.h.slice(0,n).map((t,k)=>`<p class="am">Pista ${k+1}: ${t}</p>`).join('')}</div>
 <p id="m" class="msg" aria-live="polite">${done?'<span class="good">✓ Registro recuperado: '+r.p+'</span>':''}</p></div>`;
 q('#bk').onclick=()=>go('hub');
 if(done)return;
 const m=q('#m'),inp=q('#in');inp.focus({preventScroll:true});
 const tryIt=()=>{
  const v=norm(inp.value);if(!v)return;
  if(r.ok(v)){
   S.solved[i]=1;save();[523,659,784].forEach((f,k)=>beep(f,.18,'triangle',.06,k*.1));burst();
   m.innerHTML='<span class="good">✓ Registro recuperado: '+r.p+'</span>';
   inp.disabled=q('#ok').disabled=q('#hn').disabled=true;
   R.querySelectorAll('#aSeg i').forEach((e,k)=>e.classList.toggle('on',!!S.solved[k]));
   q('#aCnt').textContent=count()+'/4 registros recuperados';
   const my=tk;setTimeout(()=>{if(my===tk)go(count()>=4?'fin':'hub')},1500);
  }else{fail();m.innerHTML='<span class="bad">✗ Clave incorrecta.</span>';shake()}
 };
 q('#ok').onclick=tryIt;inp.onkeydown=e=>{if(e.key==='Enter')tryIt()};
 q('#hn').onclick=()=>{const k=S.h[i]||0;if(k>=2)return;S.h[i]=k+1;save();beep(300,.1);
  q('#hs').insertAdjacentHTML('beforeend','<p class="am">Pista '+(k+1)+': '+r.h[k]+'</p>');
  q('#hn').textContent='Pista ('+(k+1)+'/2)';if(k+1>=2)q('#hn').disabled=true};
}
function fin(){
 const sh=shuf(['BALEX','ARIOS','P','N']);let pick=[];
 view.innerHTML=`<div class="panel" id="pn"><h2>Identidad recuperada</h2><p>Los cuatro registros dieron fragmentos. Ordenalos para formar el nombre del astronauta: nombre, apellido y sus dos iniciales.</p>
 <div class="chips" id="ch"></div><pre class="clue" id="as"></pre><div class="row"><button class="pri" id="act">Activar NEXUS</button><button id="clr">Borrar</button></div><p id="m" class="msg" aria-live="polite"></p></div>`;
 const draw=()=>{q('#as').textContent=pick.length?pick.join('  '):'_  _  _  _';
  q('#ch').innerHTML=sh.map(f=>`<button data-f="${f}" ${pick.includes(f)?'disabled':''}>${f}</button>`).join('');
  q('#ch').querySelectorAll('button').forEach(b=>b.onclick=()=>{pick.push(b.dataset.f);beep(440,.06);draw()})};
 draw();
 q('#clr').onclick=()=>{pick=[];q('#m').textContent='';draw()};
 q('#act').onclick=()=>{const m=q('#m');
  if(pick.length<4){m.innerHTML='<span class="am">Faltan fragmentos.</span>';return}
  if(pick[0]==='BALEX'&&pick[1]==='ARIOS'&&[pick[2],pick[3]].sort().join()==='N,P'){
   burst();[392,523,659,880].forEach((f,k)=>beep(f,.25,'triangle',.06,k*.12));const my=tk;setTimeout(()=>{if(my===tk)go('end')},900)
  }else{fail();m.innerHTML='<span class="bad">La identidad no coincide. Revisá el orden.</span>';shake()}};
}
function end(){
 view.innerHTML=`<div class="panel"><h2>Ruta de regreso establecida</h2><pre class="clue" id="e1"></pre><p id="e2"></p><p id="e3"></p><pre class="clue" id="e4"></pre>
 <p class="big gl" id="e5" data-t="AHORA USTEDES SABEN QUIÉN SOY." hidden>AHORA USTEDES SABEN QUIÉN SOY.</p><div id="e6" hidden><h2>Fin</h2><button class="pri" id="again">Jugar de nuevo</button></div></div>`;
 q('#again').onclick=()=>{S={solved:{},h:{},v:'intro',i:0};save();go('intro')};
 (async()=>{
  await type(q('#e1'),'IDENTIDAD RECUPERADA.\nRUTA DE REGRESO ESTABLECIDA.\nASTRA-07 LOCALIZADA.',28);
  await type(q('#e2'),'La Astra-07 aparece en los radares. Después de diecisiete años, ha regresado.');
  await type(q('#e3'),'Pero no hay nadie a bordo.');
  await type(q('#e4'),'SEÑAL DETECTADA.\nORIGEN: DESCONOCIDO.\nDISTANCIA: 17 SEGUNDOS.',40);
  const a=q('#e5'),b=q('#e6');if(!a)return;burst();beep(70,.8,'sawtooth',.07);a.hidden=false;b.hidden=false;
 })();
}
q('#aReset').onclick=()=>{if(!confirm('¿Reiniciar la investigación? Se borra tu progreso.'))return;S={solved:{},h:{},v:'intro',i:0};save();burst();go('intro')};
const advOpen=()=>{tk++;S.v=count()>=4?'fin':count()?'hub':'intro';render()};

/* ========== NAVEGACIÓN (extiende openGame sin tocarlo) ========== */
const NEW={sopa:['spGame',spReset],astra:['amGame',amStart],adv:['advGame',advOpen]},og=window.openGame;
window.openGame=g=>{
 const n=NEW[g];if(!n)return og(g);
 $$('.levels').style.display='none';$$('.video-section').style.display='none';
 document.querySelectorAll('.game-section').forEach(s=>s.style.display='none');
 $$('#'+n[0]).style.display='block';n[1]();scrollTo({top:0,behavior:'smooth'});
};
amStart();
})();
</script>
